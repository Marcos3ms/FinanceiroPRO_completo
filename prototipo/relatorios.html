<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceiroPro - Relatórios</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">FinanceiroPro</span>
        <div class="sidebar-header-icons">
          <button title="Tema"><i data-lucide="moon" style="width:18px;height:18px"></i></button>
          <button id="menu-toggle" title="Menu"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i data-lucide="layout-grid"></i> Visão Geral</a>
        <a href="contas.html" class="nav-item"><i data-lucide="wallet"></i> Contas</a>
        <a href="receitas.html" class="nav-item"><i data-lucide="circle-arrow-up"></i> Receitas</a>
        <a href="despesas.html" class="nav-item"><i data-lucide="circle-arrow-down"></i> Despesas</a>
        <a href="relatorios.html" class="nav-item active"><i data-lucide="bar-chart-3"></i> Relatórios</a>
        <a href="agendamentos.html" class="nav-item"><i data-lucide="calendar"></i> Agendamentos</a>
        <a href="configuracoes.html" class="nav-item"><i data-lucide="settings"></i> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar">S</div>
        <div class="user-info"><div class="user-name">Saudemed</div><div class="user-plan">Premium Plan</div></div>
        <button class="logout-btn" title="Sair"><i data-lucide="log-out" style="width:18px;height:18px"></i></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <h1>Relatórios</h1>
          <p>Bem-vindo de volta ao seu controle financeiro.</p>
        </div>
        <div class="page-header-right">
          <button class="icon-btn" title="Tema"><i data-lucide="moon" style="width:18px;height:18px"></i></button>
          <button class="icon-btn" title="Imprimir"><i data-lucide="printer" style="width:18px;height:18px"></i></button>
          <button class="btn btn-green"><i data-lucide="plus" style="width:16px;height:16px"></i> Nova Receita</button>
          <button class="btn btn-red"><i data-lucide="plus" style="width:16px;height:16px"></i> Nova Despesa</button>
          <button class="btn btn-outline"><i data-lucide="calendar" style="width:16px;height:16px"></i> Agendar</button>
        </div>
      </header>

      <section class="page-content">
        <!-- Empresa -->
        <div class="report-company-bar">
          <div class="filter-group" style="flex:2">
            <label for="empresa-nome">Nome da Empresa</label>
            <input type="text" id="empresa-nome" class="form-input" placeholder="Digite o nome da sua empresa">
          </div>
          <div class="filter-group" style="flex:1">
            <label for="empresa-cnpj">CNPJ</label>
            <input type="text" id="empresa-cnpj" class="form-input" placeholder="00.000.000/0000-00">
          </div>
        </div>

        <!-- Filtros do Relatório -->
        <div class="report-filters">
          <div class="report-filters__row">
            <div class="filter-group">
              <label for="rel-tipo">Tipo de Relatório</label>
              <select id="rel-tipo" class="form-select"><option>Visão Geral</option></select>
            </div>
            <div class="filter-group">
              <label for="rel-conta">Conta</label>
              <select id="rel-conta" class="form-select"><option>Todas as Contas</option></select>
            </div>
            <div class="filter-group">
              <label for="rel-di">Data Início</label>
              <input type="date" id="rel-di" class="form-input">
            </div>
            <div class="filter-group">
              <label for="rel-df">Data Fim</label>
              <input type="date" id="rel-df" class="form-input">
            </div>
          </div>
          <div class="report-filters__actions">
            <button class="btn-link">Limpar</button>
            <button class="btn btn-outline"><i data-lucide="printer" style="width:16px;height:16px"></i> Imprimir</button>
            <button class="btn btn-blue"><i data-lucide="download" style="width:16px;height:16px"></i> Exportar CSV</button>
          </div>
        </div>

        <!-- Gráficos -->
        <div class="report-charts">
          <div class="report-chart-card">
            <div class="report-chart-card__header">
              <h2 class="report-chart-card__title">Despesas por Categoria</h2>
            </div>
            <div class="chart-empty-icon">
              <i data-lucide="bar-chart-3" style="width:64px;height:64px"></i>
            </div>
          </div>

          <div class="report-chart-card">
            <div class="report-chart-card__header">
              <h2 class="report-chart-card__title">Receitas vs Despesas (6 Meses)</h2>
              <div class="period-badge">
                Período (meses): <span>6</span>
              </div>
            </div>
            <div class="chart-legend">
              <div class="chart-legend__item"><span class="legend-dot legend-dot--red"></span> despesas</div>
              <div class="chart-legend__item"><span class="legend-dot legend-dot--green"></span> receitas</div>
            </div>
            <div class="chart-area">
              <div class="chart-y-axis">
                <span class="chart-y-label">R$ 4</span>
                <span class="chart-y-label">R$ 3</span>
                <span class="chart-y-label">R$ 2</span>
                <span class="chart-y-label">R$ 1</span>
                <span class="chart-y-label">R$ 0</span>
              </div>
              <div class="chart-grid">
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
                <div class="chart-grid-line"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
